version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react-test-runtime:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
          - jsdom
          - vitest
    ignore:
      # jsdom 30 requires Node 24; keep the root test runtime on the Node 22-compatible line.
      - dependency-name: jsdom
        versions: [">=30"]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react-runtime:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
          - react-router
      vite-test-toolchain:
        patterns:
          - vite
          - "@vitejs/plugin-react"
          - vitest
          - "@vitest/coverage-v8"
          - jsdom
    ignore:
      # Upgrade the web test/build toolchain together in a dedicated compatibility change.
      - dependency-name: jsdom
        versions: [">=27"]
      - dependency-name: vite
        versions: [">=8"]
      - dependency-name: "@vitejs/plugin-react"
        versions: [">=5"]
      - dependency-name: vitest
        versions: [">=4"]
      - dependency-name: "@vitest/coverage-v8"
        versions: [">=4"]
      - dependency-name: "@testing-library/jest-dom"
        versions: [">=7"]

  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Celery 5.6 / Kombu 5.6 require redis-py <6.5.
      - dependency-name: redis
        versions: [">=6.5"]
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
