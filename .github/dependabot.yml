version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react-test-runtime:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
          - jsdom
          - vitest
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react-runtime:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
          - react-router
      vite-test-toolchain:
        patterns:
          - vite
          - "@vitejs/plugin-react"
          - vitest
          - "@vitest/coverage-v8"
          - jsdom
          - "@testing-library/jest-dom"
  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Celery 5.6 / Kombu 5.6 require redis-py <6.5.
      - dependency-name: redis
        versions: [">=6.5"]
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
