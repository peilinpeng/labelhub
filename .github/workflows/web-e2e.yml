name: Web E2E (real backend)

# 真后端端到端：用 docker compose 起全栈（mysql/redis/api/worker/web + seed 播种），
# 再用 Playwright 打 :5173（web 经 proxy 到 api，即真后端）。
# 这是唯一能拦「mock 与真后端契约漂移」的门禁——审核详情页白屏正是这一类。
# 较重，仅在涉及前后端契约面的改动、PR 与手动触发时跑。

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "packages/contracts/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - "docker-compose.yml"
      - "apps/api/Dockerfile"
      - "apps/api/requirements.txt"
      - "apps/web/Dockerfile"
      - "apps/web/nginx.conf"
      - ".dockerignore"
      - ".github/workflows/web-e2e.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "packages/contracts/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - "docker-compose.yml"
      - "apps/api/Dockerfile"
      - "apps/api/requirements.txt"
      - "apps/web/Dockerfile"
      - "apps/web/nginx.conf"
      - ".dockerignore"
      - ".github/workflows/web-e2e.yml"

concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 20.20.2
        uses: actions/setup-node@v7
        with:
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - name: Install workspace package deps
        run: npm ci

      - name: Install web deps
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Bring up full stack and wait for healthchecks
        run: docker compose up -d --build --wait

      - name: Migrate and seed deterministic E2E data
        run: docker compose --profile tools run --rm seed

      - name: Verify API and Web
        run: |
          curl --fail --show-error http://localhost:3000/api/v1/health
          curl --fail --show-error http://localhost:5173/healthz
          curl --fail --show-error --output /dev/null http://localhost:5173/

      - name: Verify runtime users and internal-only data services
        run: |
          docker compose exec -T api sh -ec 'test "$(id -u)" = "10001"'
          docker compose exec -T worker sh -ec 'test "$(id -u)" = "10001"'
          test "$(docker inspect --format '{{len .HostConfig.PortBindings}}' "$(docker compose ps -q mysql)")" = "0"
          test "$(docker inspect --format '{{len .HostConfig.PortBindings}}' "$(docker compose ps -q redis)")" = "0"

      - name: Run Playwright e2e
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Collect container logs
        if: ${{ failure() }}
        run: docker compose logs --no-color --tail=500 > docker-compose.log

      - name: Upload container logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: docker-compose-logs
          path: docker-compose.log
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down -v
