name: Web E2E (real backend)

# 真后端端到端：用 docker compose 起全栈（mysql/redis/api/worker/web + seed 播种），
# 再用 Playwright 打 :5173（web 经 proxy 到 api，即真后端），并验证导出后重复 seed。
# 这是唯一能拦「mock 与真后端契约漂移」的门禁——审核详情页白屏正是这一类。
# 较重，仅在涉及前后端契约面的改动、PR 与手动触发时跑。

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - "docker-compose.yml"
      - "docker-compose.monitoring.yml"
      - "monitoring/**"
      - "scripts/**"
      - "apps/api/Dockerfile"
      - "apps/api/requirements.txt"
      - "apps/web/Dockerfile"
      - "apps/web/nginx.conf"
      - ".dockerignore"
      - ".github/workflows/web-e2e.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - "docker-compose.yml"
      - "docker-compose.monitoring.yml"
      - "monitoring/**"
      - "scripts/**"
      - "apps/api/Dockerfile"
      - "apps/api/requirements.txt"
      - "apps/web/Dockerfile"
      - "apps/web/nginx.conf"
      - ".dockerignore"
      - ".github/workflows/web-e2e.yml"

concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.monitoring.yml
      # 仅在本工作流新建的空库登记，非空未登记库即使设此值也会拒绝。
      LABELHUB_SEED_MODE: disposable
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 26.13.0
        uses: actions/setup-node@v7
        with:
          node-version: "26.13.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - name: Install workspace package deps
        run: npm ci

      - name: Install web deps
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Prepare isolated monitoring credentials
        run: |
          python - <<'PYCODE'
          import os, secrets
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          with open(os.environ["GITHUB_ENV"], "a") as env:
              for name, filename in [("METRICS_TOKEN_FILE", "metrics-token"), ("GRAFANA_PASSWORD_FILE", "grafana-password")]:
                  path = root / filename
                  path.write_text(secrets.token_urlsafe(40))
                  path.chmod(0o444)
                  env.write(f"{name}={path}\n")
          PYCODE

      - name: Bring up full stack and wait for healthchecks
        run: python3 scripts/local-compose.py up -d --build --wait

      - name: Migrate and seed deterministic E2E data
        run: docker compose --profile tools run --rm seed

      - name: Verify monitoring deployment
        run: |
          docker compose exec -T prometheus promtool check config /etc/prometheus/prometheus.yml
          docker compose exec -T prometheus promtool check rules /etc/prometheus/alerts.yml
          python scripts/verify-monitoring.py

      - name: Verify API and Web
        run: |
          curl --fail --show-error http://localhost:3000/api/v1/health
          curl --fail --show-error http://localhost:5173/healthz
          curl --fail --show-error --output /dev/null http://localhost:5173/

      - name: Verify runtime users and internal-only data services
        run: |
          docker compose exec -T api sh -ec 'test "$(id -u)" = "10001"'
          docker compose exec -T worker sh -ec 'test "$(id -u)" = "10001"'
          test "$(docker inspect --format '{{len .HostConfig.PortBindings}}' "$(docker compose ps -q mysql)")" = "0"
          test "$(docker inspect --format '{{len .HostConfig.PortBindings}}' "$(docker compose ps -q redis)")" = "0"

      - name: Run MySQL concurrency checks
        run: |
          docker compose run --rm --no-deps --user 0 --entrypoint sh \
            -e E2E_BASE=http://api:3000/api/v1 \
            -e E2E_EMAIL_DOMAIN=labelhub.com -e E2E_PASSWORD=password123 \
            -v "$PWD/apps/api/tests:/app/tests:ro" \
            -v "$PWD/apps/api/pytest.ini:/app/pytest.ini:ro" \
            -v "$PWD/apps/api/requirements-dev.txt:/app/requirements-dev.txt:ro" \
            api -ec 'python -m pip install --require-hashes -r requirements-dev.txt >/tmp/test-install.log && python -m pytest -m integration -v'

      - name: Run Playwright e2e
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
        run: npm run e2e

      - name: Create a non-empty export after reviewer acceptance
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
        run: npx playwright test e2e/owner.spec.ts --grep "创建导出"

      - name: Verify repeat-seed export precondition
        run: docker compose exec -T -e REQUIRE_MIGRATION_RECORDS=true api python scripts/verify_seed_repeat_precondition.py

      - name: Verify seed remains idempotent after export workflows
        run: docker compose --profile tools run --rm seed

      - name: Verify all initialization entrypoints refuse existing data by default
        run: docker compose exec -T api python scripts/verify_seed_protection.py

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Collect container logs
        if: ${{ failure() }}
        run: docker compose logs --no-color --tail=500 > docker-compose.log

      - name: Upload container logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: docker-compose-logs
          path: docker-compose.log
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down -v
