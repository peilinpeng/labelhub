name: Shared packages and Web CI

# 共享包与前端 CI：
# - shared-packages 守住 packages/* 的严格类型检查与单元测试；
# - web 守住 apps/web 的类型检查、组件测试与生产构建。
# 真后端 E2E 见 web-e2e.yml。

on:
  push:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/web-ci.yml"

concurrency:
  group: shared-web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-packages:
    name: Shared packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 20.20.2
        uses: actions/setup-node@v7
        with:
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install shared package dependencies
        run: npm ci

      - name: Typecheck shared packages
        run: npm run typecheck

      - name: Test shared packages
        run: npm test

      - name: Audit shared production dependencies
        run: npm audit --omit=dev --audit-level=high

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 20.20.2
        uses: actions/setup-node@v7
        with:
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - name: Install shared package dependencies
        run: npm ci
        working-directory: ${{ github.workspace }}

      - name: Install web dependencies
        run: npm ci

      - name: Typecheck Web
        run: npm run typecheck

      - name: Test Web (Vitest + MSW)
        run: npm run test:run

      - name: Build Web
        run: npm run build

      - name: Audit Web production dependencies
        run: npm audit --omit=dev --audit-level=high
